name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npx expo export --platform web
        env:
          NODE_ENV: production

      - name: Fix paths for GitHub Pages subdirectory
        run: |
          # Les chemins absolus générés par Expo doivent inclure /reset-sos/
          sed -i 's|src="/_expo/|src="/reset-sos/_expo/|g' dist/index.html
          sed -i 's|href="/favicon\.ico"|href="/reset-sos/favicon.ico"|g' dist/index.html
          sed -i 's|href="/assets/|href="/reset-sos/assets/|g' dist/index.html

      - name: Add PWA files
        run: |
          cp sw.js dist/
          cp manifest.json dist/
          touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
