name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npx expo export --platform web
        env:
          NODE_ENV: production

      - name: Fix paths and inject PWA into HTML/JS
        run: |
          python3 << 'PYEOF'
          import re, glob, os

          BASE = "/reset-sos"

          # ── Patch index.html ──────────────────────────────────────────────
          with open("dist/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          html = html.replace('src="/_expo/',   f'src="{BASE}/_expo/')
          html = html.replace('href="/favicon.ico"', f'href="{BASE}/favicon.ico"')
          html = html.replace('href="/assets/', f'href="{BASE}/assets/')

          pwa = f'''
          <link rel="manifest" href="{BASE}/manifest.json" />
          <meta name="apple-mobile-web-app-capable" content="yes" />
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
          <meta name="apple-mobile-web-app-title" content="RESET SOS" />'''

          sw = f'''<script>
          if("serviceWorker"in navigator){{
            window.addEventListener("load",function(){{
              navigator.serviceWorker.register("{BASE}/sw.js",{{scope:"{BASE}/"}});
            }});
          }}
          </script>'''

          html = html.replace("</head>", pwa + "\n</head>")
          html = html.replace("</body>", sw + "\n</body>")

          with open("dist/index.html", "w", encoding="utf-8") as f:
              f.write(html)

          # ── Patch JS bundle : /assets/ → /reset-sos/assets/ ──────────────
          for js_path in glob.glob("dist/_expo/static/js/web/*.js"):
              with open(js_path, "r", encoding="utf-8") as f:
                  js = f.read()
              # Remplace les chemins absolus d'assets
              js = js.replace('"/assets/', f'"{BASE}/assets/')
              js = js.replace("'/assets/", f"'{BASE}/assets/")
              with open(js_path, "w", encoding="utf-8") as f:
                  f.write(js)
              print(f"Patched: {js_path}")

          print("All paths fixed.")
          PYEOF

      - name: Add PWA files
        run: |
          cp sw.js dist/
          cp manifest.json dist/
          touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
